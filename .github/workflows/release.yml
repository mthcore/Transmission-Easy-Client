name: Build and Release

on:
  push:
    tags:
      - 'v*'

# The build job produces the bytes published to three stores, so its actions
# are pinned to full commit SHAs too — pinning only the publishing jobs would
# leave the artifact tamperable upstream in the same workflow.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # This job publishes to three stores. It used to do so without running a
      # single check: ci.yml has the full gate but does not trigger on tags, so
      # a tag pushed at a commit CI never saw shipped unverified. The suite now
      # carries regression tests for real vulnerabilities (the IPv4-mapped IPv6
      # SSRF bypass, the sender.url trust-boundary hole) — security controls CI
      # does not run before publishing are controls in name only.
      - name: Check locales
        run: npm run check:locales

      - name: Check versions and build targets
        run: npm run check:versions

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build Chrome
        run: npm run build

      # Never publish a bundle nobody has executed: the unit suite cannot see a
      # production bundling defect (it never runs webpack/Babel as configured
      # for release).
      - name: Smoke test the Chrome build
        run: npm run smoke -- --browser chrome

      - name: Build Firefox
        # The manifest id must equal the GUID of the AMO listing, or the upload
        # fails validation with ADDON_ID_REQUIRED
        env:
          FIREFOX_ADDON_ID: ${{ secrets.FIREFOX_ADDON_GUID }}
        run: npm run build:firefox

      - name: Smoke test the Firefox build
        run: npm run smoke -- --browser firefox

      - name: Build Opera
        run: npm run build:opera

      # webpack emits into dist/<browser>/src, so the archive MUST be made from
      # that directory: zipping dist/<browser> produced a package whose root
      # held a 'src/' folder instead of manifest.json — invalid for every store.
      - name: Create Chrome ZIP
        run: |
          cd dist/chrome/src
          zip -r ../../../transmission-chrome-${{ github.ref_name }}.zip .

      - name: Create Firefox ZIP
        run: |
          cd dist/firefox/src
          zip -r ../../../transmission-firefox-${{ github.ref_name }}.zip .

      - name: Create Opera ZIP
        run: |
          cd dist/opera/src
          zip -r ../../../transmission-opera-${{ github.ref_name }}.zip .

      # AMO requires the sources for a bundled/minified add-on
      - name: Create Firefox source archive
        run: npm run _compressSource -- --BROWSER firefox

      - name: Verify the packages are store-shaped
        run: |
          for browser in chrome firefox opera; do
            if ! unzip -l transmission-$browser-${{ github.ref_name }}.zip | grep -qE ' manifest\.json$'; then
              echo "::error::transmission-$browser package has no manifest.json at its root"
              exit 1
            fi
          done

      # The stores read the version from the manifest, not from the tag: a tag
      # that runs ahead of the manifest publishes an already-existing version
      # and is rejected after the release has been tagged and announced.
      - name: Verify the tag matches the manifest version
        run: |
          manifest_version=$(node -p "require('./src/manifest.json').version")
          if [ "$manifest_version" != "${{ steps.get_version.outputs.version }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-extension
          path: transmission-chrome-${{ github.ref_name }}.zip

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firefox-extension
          path: transmission-firefox-${{ github.ref_name }}.zip

      - name: Upload Firefox source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firefox-source
          path: dist/firefox/*-source.zip

      - name: Upload Opera artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opera-extension
          path: transmission-opera-${{ github.ref_name }}.zip

  # Deploy to Chrome Web Store
  deploy-chrome:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_CHROME == 'true' }}

    steps:
      - name: Download Chrome artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chrome-extension

      - name: Upload to Chrome Web Store
        # Pinned to a full commit SHA: these jobs receive store-publishing
        # secrets, and mutable tags could be repointed at malicious code
        uses: mnao305/chrome-extension-upload@4008e29e13c144d0f6725462cbd49b7c291b4928 # v5.0.0
        with:
          file-path: transmission-chrome-${{ github.ref_name }}.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

  # Deploy to Firefox Add-ons (AMO)
  deploy-firefox:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_FIREFOX == 'true' }}

    steps:
      - name: Download Firefox artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firefox-extension

      - name: Download Firefox source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firefox-source
          path: source

      - name: Upload to Firefox Add-ons
        uses: wdzeng/firefox-addon@3184ee491b500e080885e046051366a4228c6e5d # v1
        with:
          addon-guid: ${{ secrets.FIREFOX_ADDON_GUID }}
          xpi-path: transmission-firefox-${{ github.ref_name }}.zip
          # AMO requires the sources for a bundled/minified add-on: the archive
          # was being built and uploaded as a CI artifact but never submitted,
          # so every review was held waiting for a source request
          source-file-path: source/transmissionEasyClient-firefox-${{ needs.build.outputs.version }}-source.zip
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}

  # Deploy to Edge Add-ons
  deploy-edge:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_EDGE == 'true' }}

    steps:
      - name: Download Chrome artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chrome-extension

      - name: Upload to Edge Add-ons
        # aspect-labs/edge-addon-action no longer exists on GitHub (404);
        # wdzeng/edge-addon (same author as the Firefox action) takes the
        # same inputs in its v1 API
        uses: wdzeng/edge-addon@e307af4adb6d4e1c12387dc7d6bd545dcd075909 # v1
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          client-secret: ${{ secrets.EDGE_CLIENT_SECRET }}
          access-token-url: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}
          zip-path: transmission-chrome-${{ github.ref_name }}.zip
